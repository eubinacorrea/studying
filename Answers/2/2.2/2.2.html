<body>
    <h1>Praticando JS - DOM</h1>

    <img id="foto" src="https://img.magnific.com/vetores-gratis/lampada-realista-isolada_1284-41741.jpg?semt=ais_hybrid&w=740&q=80" alt="Lâmpada" width="200">

<button id="btnLigar">Ligar</button>
<button id="btnDesligar">Desligar</button>

</body>
