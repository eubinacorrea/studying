<head>

<body>
    <h1>Praticando JS - DOM</h1>
<p>Crie uma lista < ul> com 5 itens < li>. Usando querySelector, selecione o primeiro item e mude a cor do texto para vermelho. Usando querySelectorAll, selecione todos os itens e adicione uma borda pontilhada em cada um.</p>

    <div class="container">
        <ul>
        <li id="item1" >Item 1</li>
        <li id="item2">Item 2</li>
        <li id="item3">Item 3</li> 
        <li id="item4">Item 4</li>
        <li id="item5">Item 5</li>
        </ul>
    </div>

</body>
