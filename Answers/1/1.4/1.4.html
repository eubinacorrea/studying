<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="1.4.css">
    <title>Praticando JS - DOM</title>
</head>
<body>
    <h1>Praticando JS - DOM</h1>

    <p>Crie vários botões com < button>. Use getElementsByTagName para adicionar um evento de clique a todos os botões de uma só vez (cada clique exibe "Botão clicado" no console).</p>

    <div class="botoes-container">
        <button class="botao" name="botao1">Botão 1</button>
        <button class="botao" name="botao2">Botão 2</button>
        <button class="botao" name="botao3">Botão 3</button>
        <button class="botao" name="botao4">Botão 4</button>
        <button class="botao" name="botao5">Botão 5</button>
    </div>



<script src="1.4.js"></script>
    
</body>
</html>
